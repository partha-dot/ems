<div class="grid">

	<div class="col-8">
		<div class="card">
            <div style="display: flex;">
				<!-- <img src="assets/demo/images/login/schedule.gif" alt="Image" height="50" > -->
        <h4>Manage Scheduling</h4></div>

        <form [formGroup]="stockIn">
				<div class="p-fluid p-formgrid grid">
					<div class="field col-12 md:col-6">
						<label htmlFor="firstname2">Select Device</label>
						<p-autoComplete [(ngModel)]="selectedCountryAdvanced" [ngModelOptions]="{standalone: true}" (onSelect)="selected()" [suggestions]="filteredCountries" (completeMethod)="filterCountry($event)" field="device" [dropdown]="true">
						</p-autoComplete>
					</div>
					<!-- <div class="field col-12 md:col-6">
						<label htmlFor="firstname2">Select Channel</label>
						<p-autoComplete [(ngModel)]="selectedDealer" [ngModelOptions]="{standalone: true}" (onSelect)="setDealer()" [suggestions]="filteredDealer" (completeMethod)="filterDealer($event)" field="unit_name" [dropdown]="true">
						</p-autoComplete>
					</div> -->
					<div class="field col-12 md:col-3">
						<label htmlFor="firstname2">DO TYPE:</label>
						<p-autoComplete [(ngModel)]="selectedDealer" [ngModelOptions]="{standalone: true}" (onSelect)="setDealer()" [suggestions]="filteredDealer" (completeMethod)="filterDealer($event)" field="unit_name" [dropdown]="true">
						</p-autoComplete>
					</div>
					<div class="field col-12 md:col-3">
						<label htmlFor="lastname2">Relay Close Time</label>
						<input pInputText formControlName="relay_close_time" type="time" />
					</div>
					<!-- <div class="field col-12 md:col-2">
						<label htmlFor="city">Relay Delay Time</label>
						<input pInputText formControlName="relay_delay_time" type="time" />
					</div> -->
					<div class="field col-12 md:col-3">
						<label htmlFor="city">Timer Start Hrs</label>
						<input pInputText formControlName="timer_start_hours" type="time" />
					</div>

					<div class="field col-12 md:col-3">
						<label htmlFor="city">Timer Start Min</label>
						<input pInputText formControlName="timer_start_minutes" type="time" />

					</div>
					<!-- <div class="field col-12 md:col-2">
						<label htmlFor="city">Timer stop min </label>
						<span class="p-input-icon-right">
                            <input pInputText formControlName="timer_stop_hours_1" type="time" />
						<i class="pi pi-calendar"></i>
						</span>
					</div> -->
					<div class="field col-12 md:col-3">
						<label htmlFor="city">Timer stop hrs -1 </label>
						<input pInputText formControlName="timer_stop_hours_1" type="time" />
					</div>
					<div class="field col-12 md:col-3">
						<label htmlFor="city">Timer stop min -1 </label>
						<input pInputText formControlName="timer_stop_minutes_1" type="time" />
					</div>
					<!-- <div class="field col-12 md:col-2">
						<label htmlFor="city">Sale Warranty</label>
						<span class="p-input-icon-right">
						<p-calendar  formControlName="sels_warranty" [showButtonBar]="true"></p-calendar>
						<i class="pi pi-calendar"></i>
						</span>
					</div> -->
				</div>


					<div class="field col-12 md:col-12" >

						<p-button icon="pi pi-check" (click)="insertStockData()" styleClass="p-button-primary " label="Update Settings"></p-button>
						&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<p-button icon="pi pi-refresh" (click)="resetData()" styleClass="p-button-danger" label="Reset"></p-button>

					</div>
					<div class="field col-12 md:col-2" >

					</div>

			</form>

		</div>
	</div>
    <div class="col-4" style="justify-content: center;">

    </div>
</div>
